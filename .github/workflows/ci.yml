name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: fiscal
          POSTGRES_DB: fiscal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscal -d fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fiscal:fiscal@localhost:5432/fiscal_test
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SECRET_KEY: ci-secret-key
      FIRST_SUPERUSER_EMAIL: admin@fiscal.mg
      FIRST_SUPERUSER_PASSWORD: admin123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest
        run: |
          set +e
          python -m pytest --tb=short -q > pytest-out.log 2>&1
          status=$?
          set -e
          cat pytest-out.log
          if [ $status -ne 0 ]; then
            echo "::error title=pytest failed::exit code $status"
            grep -E '^(E  |E   |FAILED|ERROR|_{5,} .* _{5,})' pytest-out.log | head -n 15 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            {
              echo ''
              echo '```'
              tail -n 40 pytest-out.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  frontend:
    name: Frontend (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: fiscal
          POSTGRES_DB: fiscal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscal -d fiscal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fiscal:fiscal@localhost:5432/fiscal_test
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SECRET_KEY: ci-secret-key
      FIRST_SUPERUSER_EMAIL: admin@fiscal.mg
      FIRST_SUPERUSER_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend deps
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Seed database
        working-directory: backend
        run: python -m app.seed && python -m app.seed_demo

      - name: "Start backend + frontend (dev server, CORS: 5173)"
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ../frontend && npm run dev -- --host 127.0.0.1 --port 5173 &
          cd ../frontend && npx wait-on tcp:8000 tcp:5173

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: frontend
        run: npx playwright test